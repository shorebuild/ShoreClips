<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; media-src file: blob:; style-src 'unsafe-inline'"><title>ShoreClips Player</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080c0f;color:#edf5f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#17352d 0,transparent 42%),#080c0f}.top{padding:20px 26px;border-bottom:1px solid #26363a;display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#9cebd1;color:#09231a;font-weight:800;font-size:20px}.brand{font-weight:750}.sub{color:#91a39f;font-size:11px;margin-top:2px}main{width:min(1100px,94vw);margin:32px auto;flex:1}h1{font-size:20px;overflow-wrap:anywhere}video{display:block;width:100%;max-height:72vh;background:#000;border:1px solid #29383b;border-radius:14px}p{color:#9cadaa;font-size:13px}.foot{padding:18px 26px;border-top:1px solid #26363a;color:#7d918d;font-size:11px}
</style></head><body><header class="top"><div class="logo">S</div><div><div class="brand">ShoreClips</div><div class="sub">CLIP PLAYER</div></div></header><main><h1 id="title">Saved clip</h1><video id="video" controls playsinline preload="metadata"></video><p id="status">Local clip · stored on this Mac</p></main><footer class="foot">ShoreClips · Local playback</footer><script>
const params=new URLSearchParams(location.search);const src=params.get('src');const title=params.get('title')||'Saved clip';document.title=title+' — ShoreClips';document.getElementById('title').textContent=title;const video=document.getElementById('video');if(src&&src.startsWith('file://')){video.src=src;}else{document.getElementById('status').textContent='The clip path is missing or invalid.';}
video.addEventListener('error',()=>{document.getElementById('status').textContent='This clip could not be decoded. Try exporting it again with the latest ShoreClips build.';});
</script></body></html>
