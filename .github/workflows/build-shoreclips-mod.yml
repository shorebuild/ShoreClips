name: Build ShoreClips Fabric JAR

on:
  push:
    branches:
      - shoreclips-mod-jar-build
    paths:
      - "ShoreClipsStudio/mod/**"
      - ".github/workflows/build-shoreclips-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric-mod:
    name: Compile installable Fabric mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile mod
        working-directory: ShoreClipsStudio/mod
        run: gradle clean build --no-daemon

      - name: Verify installable mod archive
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find ShoreClipsStudio/mod/build/libs -maxdepth 1 -type f -name 'shoreclips-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          jar tf "$JAR" | grep -q 'net/shoreclips/mod/ShoreClipsClient.class'
          echo "Built $JAR"
          mkdir -p release
          cp "$JAR" release/ShoreClips-Fabric-26.1.2.jar

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: ShoreClips-Fabric-26.1.2
          path: release/ShoreClips-Fabric-26.1.2.jar
          if-no-files-found: error
          retention-days: 30
