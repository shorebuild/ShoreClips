name: Build ShoreClips installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: shoreclips-installers
  cancel-in-progress: true

jobs:
  macos-intel:
    name: Build macOS Intel (x64) DMG and ZIP
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --mac dmg zip --x64 --publish never
      - run: ls -lah dist
      - uses: actions/upload-artifact@v4
        with:
          name: ShoreClips-macOS-Intel-x64
          path: |
            dist/*x64.dmg
            dist/*x64.zip
          if-no-files-found: error

  macos-apple-silicon:
    name: Build macOS Apple Silicon (arm64) DMG and ZIP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --mac dmg zip --arm64 --publish never
      - run: ls -lah dist
      - uses: actions/upload-artifact@v4
        with:
          name: ShoreClips-macOS-Apple-Silicon-arm64
          path: |
            dist/*arm64.dmg
            dist/*arm64.zip
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ShoreClips-Windows
          path: dist/*
          if-no-files-found: error
