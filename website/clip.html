<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Watch a clip shared with ShoreClips."><title>Watch clip — ShoreClips</title><link rel="stylesheet" href="./site.css"><style>.watch{max-width:1000px;margin:55px auto 90px;padding:0 24px;min-height:55vh}.watch video{display:block;width:100%;max-height:72vh;background:#000;border:1px solid var(--line);border-radius:14px}.watch h1{font-size:clamp(26px,4vw,42px);overflow-wrap:anywhere}.watch .status{color:var(--muted);font-size:13px}.watch .shareurl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.watch .shareurl input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px}</style></head>
<body><nav><a class="brand" href="./index.html"><b>S</b> ShoreClips</a><div><a href="./index.html#features">Features</a><a href="./downloads.html">Downloads</a><a href="./help.html">Help</a></div></nav><main class="watch"><p class="eyebrow">SHARED CLIP</p><h1 id="clipTitle">Loading clip…</h1><video id="player" controls playsinline preload="metadata"></video><p class="status" id="status">Loading shared video…</p><div class="shareurl"><input id="url" readonly aria-label="Clip share URL"><button class="button" id="copy">Copy link</button></div></main><footer><a class="brand" href="./index.html">ShoreClips</a><div><a href="./help.html">Help</a><a href="./privacy.html">Privacy</a></div><small>© 2026 ShoreClips</small></footer><script>
(async()=>{const id=location.pathname.split('/').filter(Boolean).pop();const title=document.getElementById('clipTitle'),video=document.getElementById('player'),status=document.getElementById('status'),url=document.getElementById('url');url.value=location.href;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='Link copied.'}catch{url.select();status.textContent='Copy the selected link.'}};if(!id||id==='c'){title.textContent='Clip not found';status.textContent='This link does not contain a clip ID.';video.hidden=true;return;}try{const res=await fetch('/api/clips/'+encodeURIComponent(id));if(!res.ok)throw new Error('This clip may have been deleted or the link may be invalid.');const data=await res.json();title.textContent=data.name||'Shared clip';document.title=title.textContent+' — ShoreClips';video.src='/api/clips/'+encodeURIComponent(id)+'/video';status.textContent='Anyone with this link can watch this clip.';video.addEventListener('error',()=>status.textContent='The video could not be played. The uploaded file may be invalid.');}catch(e){title.textContent='Clip unavailable';status.textContent=e.message;video.hidden=true;}})();
</script></body></html>
